<!doctype html>
<!--
  S-8 #2 — a CSS-in-JS runtime.

  `insertRule` leaves a `<style>` element whose text node is EMPTY, so a serializer that
  reads the text captures nothing at all. This is most of a modern application's styling.
  It also fires no mutation record, so rules added after the snapshot need their own
  detection.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CSS-in-JS</title>
<style id="runtime"></style>
</head>
<body>
  <div class="sc-panel" data-probe="panel">
    <h1 class="sc-title" data-probe="title">Basket</h1>
    <p class="sc-note" data-probe="note">Delivered Thursday</p>
    <button class="sc-cta" data-probe="cta">Checkout</button>
  </div>
  <script>
    var sheet = document.getElementById("runtime").sheet;
    var rules = [
      "body{font:16px/1.5 system-ui,sans-serif;margin:20px;background:#0f1419;color:#f2f5f8}",
      ".sc-panel{max-width:480px;padding:24px;border-radius:16px;background:#1b222b;border:1px solid #333c46}",
      ".sc-title{font-size:26px;margin:0 0 8px;color:#7aafff}",
      ".sc-note{color:#97a3af;margin:0 0 16px}",
      ".sc-cta{background:#5b9bff;color:#06121f;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:15px}"
    ];
    rules.forEach(function (r, i) { sheet.insertRule(r, i); });
    // A rule added late, after any snapshot a test takes on load.
    window.addLateRule = function () {
      sheet.insertRule(".sc-panel{outline:3px solid #4ad486}", sheet.cssRules.length);
    };
    // A rule EDITED IN PLACE, which is what a theme switcher does — and what the old
    // `cssRules.length` change detector could not see, because the count does not move.
    window.editRuleInPlace = function () {
      for (var i = 0; i < sheet.cssRules.length; i++) {
        var rule = sheet.cssRules[i];
        if (rule.selectorText === ".sc-title") {
          rule.style.setProperty("color", "rgb(255, 0, 128)");
          return;
        }
      }
    };
  </script>
</body>
</html>
